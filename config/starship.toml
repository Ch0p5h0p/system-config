
format = """
[](fg:#29201a)$directory[](fg:#29201a bg:#3b2c22)$git_branch$git_status[](fg:#3b2c22 bg:#1e1814)$package$rust$cmake$c$cpp$gradle$java$python[](fg:#1e1814) 
"""

[directory]
format = "[ $path ]($style)"
style = "bold fg:#dfb991 bg:#29201a"

[git_branch]
format = "[ $symbol$branch]($style)"
style = "bold fg:#b9bd98 bg:#3b2c22"

[git_status]
format = "[ $all_status$ahead_behind ]($style)"
style = "bold fg:#d4c29f bg:#3b2c22"

[package]
symbol = "󰏖 "
format = "[ $symbol$version ]($style)"
style = "bold fg:#c5afd3 bg:#1e1814"

[gradle]
symbol = " "
format = "[ $symbol$version ]($style)"
style = "bold fg:#b9bd98 bg:#1e1814"

[cmake]
symbol = " "
format = "[ $symbol$version ]($style)"
style = "bold fg:#d3a0ae bg:#1e1814"

[rust]
symbol = "󱘗 "
format = "[ $symbol$version ]($style)"
style = "bold fg:#dfb783 bg:#1e1814"

[c]
symbol = " "
format = "[ $symbol$name $version ]($style)"
style = "bold fg:#a0bac4 bg:#1e1814"

[cpp]
symbol = " "
format = "[ $symbol$name $version ]($style)"
style = "bold fg:#a0bac4 bg:#1e1814"

[java]
symbol = " "
format = "[ $symbol$version ]($style)"
style = "bold fg:#dfb783 bg:#1e1814"

[python]
symbol = " "
format = "[ $symbol$version ]($style)"
style = "bold fg:#d4c29f bg:#1e1814"
python_binary = ["python", "python3"]

[nix_shell]
symbol = " "
format = "[ $symbol$name ]($style)"
style = "bold fg:#a0bac4 bg:#1e1814"

[character]
disabled = true

